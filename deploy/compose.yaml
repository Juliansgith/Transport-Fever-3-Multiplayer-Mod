# The project's own name, whatever its folder is called. Another service's
# `deploy` folder on the same host (tf2mp-relay's is one) would otherwise
# make the same project, and a `docker compose down` in either could stop
# the other.
name: tpf3mp

services:
  tpf3mp-server:
    # The published image (`docker compose pull`), pinned with
    # TPF3MP_VERSION in deploy/.env; `docker compose up -d --build` builds
    # it from this checkout instead (docs/OPERATIONS.md, "Upgrades").
    image: ghcr.io/juliansgith/tpf3mp-server:${TPF3MP_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # The host's ports: these by default. A newer release's server beside
    # an older one takes others, as its own project (`docker compose -p
    # tpf3mp-p26 --env-file p26.env up -d`; docs/OPERATIONS.md, "Two versions
    # at once").
    ports:
      # Players: QUIC over UDP.
      - "${TPF3MP_UDP_PORT:-29470}:29470/udp"
      # Players whose networks block UDP: WebSocket tunnels, for the host's
      # reverse proxy only (see docs/OPERATIONS.md, "Tunnels").
      - "127.0.0.1:${TPF3MP_TUNNEL_PORT:-29471}:29471/tcp"
      # Metrics and health, for the host only. Never publish this publicly.
      - "127.0.0.1:${TPF3MP_ADMIN_PORT:-9470}:9470/tcp"
    volumes:
      # fullchain.pem and privkey.pem, readable by UID 65532 (see
      # docs/OPERATIONS.md).
      - ./certs:/certs:ro
      - tpf3mp-data:/data
      # Where a draining server hands its games over and the newer one takes
      # them in, the same for every release's server on the host.
      - tpf3mp-handover:/handover
    environment:
      RUST_LOG: info
      # "json" for a log collector; "text" reads best in `docker compose logs`.
      TPF3MP_LOG_FORMAT: text
      # The server authenticates this reviewed registry to its clients. A
      # release tag pins the list; each package still has its own hashes and
      # requires exact-identity consent before native code is fetched.
      TPF3MP_NATIVE_MODS_REGISTRY: https://raw.githubusercontent.com/Juliansgith/Transport-Fever-3-Multiplayer-Mod/v1.3.3/deploy/native-mods.txt
    # Keep at most 10 files of 50 MB each, so the log never fills the disk.
    # `deploy/collect-logs.sh` gathers them, with the server's state, for a
    # bug report (see docs/OPERATIONS.md, "Logs").
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    # Each tunnel is an open connection; see docs/OPERATIONS.md, "Tunnels".
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    cpus: 2
    # The server closes every session with SHUTTING_DOWN on SIGTERM.
    stop_grace_period: 30s

volumes:
  tpf3mp-data:
  # Shared by the projects of every release on the host: create it once
  # (`docker volume create tpf3mp-handover`; `tpf3mp-ctl deploy` does).
  tpf3mp-handover:
    external: true
    name: tpf3mp-handover
