# TPF3-MP's developers log in with a key and run tpf3mp-dev-shell, nothing
# else: no shell, no files, no terminal, no forwarding to anything on the
# host (docs/OPERATIONS.md, "Developer access"). install.sh puts it in
# place as /etc/ssh/sshd_config.d/50-tpf3mp-devs.conf, and keeps it only if
# `sshd -t` passes and root's effective settings stay as they were.
Match Group tpf3mp-devs
    ForceCommand /usr/local/sbin/tpf3mp-dev-shell
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    PermitUserRC no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    X11Forwarding no
    GatewayPorts no
    PermitOpen none
    PermitListen none
