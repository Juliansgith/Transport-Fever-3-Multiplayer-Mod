name: package

# Builds the player's package for every platform, as the workflow artifacts
# windows-x64, linux-x64 and macos-arm64: the launcher window, the agent,
# the in-game hook library and the server. Called by release.yml, for a
# release of the workspace's version, and by dev-build.yml, for a dev
# build of its own version.
#
# Repository variables it builds in (Settings, Secrets and variables,
# Actions, Variables):
# - TPF3MP_DEFAULT_SERVER: the server the launcher plays on, and the only
#   one (docs/DECISIONS.md, D12);
# - TPF3MP_SERVER_NAME: what players see of that server, such as EU, in
#   place of its address;
# - TPF3MP_UPDATE_PUBLIC_KEY: the public keys releases must be signed with.
#   Without one the launcher never updates itself;
# - TPF3MP_UPDATE_DEV_PUBLIC_KEY: the public keys dev builds are signed
#   with, trusted only on the launcher's Dev track (D19).
#
# The hook library goes next to the launcher, which loads it into the game
# it starts and nowhere else (docs/DECISIONS.md, D11): the package puts
# nothing in the game's folder. Actions are pinned to commits, since what
# this builds gets signed.
on:
  workflow_call:
    inputs:
      version:
        description: The version the packages carry, such as 0.2.0 or 0.2.1-dev.14
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          # The oldest supported Ubuntu, so the binaries also run on
          # distributions with an older C library.
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # Built into the launcher: the server it plays on, the key its
      # updates must be signed with, and where it looks for them.
      TPF3MP_DEFAULT_SERVER: ${{ vars.TPF3MP_DEFAULT_SERVER }}
      TPF3MP_SERVER_NAME: ${{ vars.TPF3MP_SERVER_NAME }}
      TPF3MP_UPDATE_PUBLIC_KEY: ${{ vars.TPF3MP_UPDATE_PUBLIC_KEY }}
      TPF3MP_UPDATE_DEV_PUBLIC_KEY: ${{ vars.TPF3MP_UPDATE_DEV_PUBLIC_KEY }}
      # The version the launcher calls itself: a dev build's own.
      TPF3MP_VERSION: ${{ inputs.version }}
      TPF3MP_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check the settings built in
        shell: bash
        run: |
          set -euo pipefail
          # A bracket expression: "]" first and "-" last are literal.
          if [ -n "$TPF3MP_DEFAULT_SERVER" ] && ! [[ "$TPF3MP_DEFAULT_SERVER" =~ ^[]A-Za-z0-9.:[-]+$ ]]; then
            echo "::error::TPF3MP_DEFAULT_SERVER must be host:port, nothing else"
            exit 1
          fi
          if [ -n "$TPF3MP_SERVER_NAME" ] && ! [[ "$TPF3MP_SERVER_NAME" =~ ^[A-Za-z0-9\ ._-]{1,24}$ ]]; then
            echo "::error::TPF3MP_SERVER_NAME must be a short name such as EU: letters, digits, spaces, dots and dashes"
            exit 1
          fi
          # One key or several, separated by commas or spaces.
          if [ -n "$TPF3MP_UPDATE_PUBLIC_KEY" ] && ! [[ "$TPF3MP_UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=([\ ,]+[A-Za-z0-9+/]{43}=)*$ ]]; then
            echo "::error::TPF3MP_UPDATE_PUBLIC_KEY must be base64 32-byte Ed25519 public keys, separated by commas"
            exit 1
          fi
          if [ -n "$TPF3MP_UPDATE_DEV_PUBLIC_KEY" ] && ! [[ "$TPF3MP_UPDATE_DEV_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=([\ ,]+[A-Za-z0-9+/]{43}=)*$ ]]; then
            echo "::error::TPF3MP_UPDATE_DEV_PUBLIC_KEY must be base64 32-byte Ed25519 public keys, separated by commas"
            exit 1
          fi
          if ! [[ "$TPF3MP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TPF3MP_VERSION is not a version"
            exit 1
          fi
          if [ -z "$TPF3MP_UPDATE_PUBLIC_KEY" ]; then
            echo "::warning::no TPF3MP_UPDATE_PUBLIC_KEY: these launchers will never update themselves"
          fi
      # The launcher's window is a web view (D16): WebKitGTK and GTK to
      # build it on Linux.
      - name: Linux libraries for the launcher's window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev librsvg2-dev
      - name: Build
        run: |
          cargo build --release --locked -p tpf3mp-launcher -p tpf3mp-agent -p tpf3mp-server -p tpf3mp-hook
          # Stands in for the game in playtests until it is out.
          cargo build --release --locked -p tpf3mp-testkit --bin tpf3mp-fakegame
      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dir="tpf3mp-${VERSION}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp README.md LICENSE docs/PLAYING.md "$dir/"
          # The Lua mod, once the repository has it; the install scripts
          # copy it into the player's mods folder, the only thing they
          # install.
          if [ -d mod/tpf3mp_1 ]; then
            mkdir -p "$dir/mod"
            cp -R mod/tpf3mp_1 "$dir/mod/"
          else
            echo "::notice::no mod/tpf3mp_1 in the repository yet: the package carries no Lua mod"
          fi
          # Tells the launcher's updater this folder is an installed package.
          printf '{"version":"%s","platform":"%s"}\n' "$VERSION" "${{ matrix.name }}" \
            > "$dir/tpf3mp-package.json"
          case "${{ matrix.name }}" in
            windows-*)
              cp target/release/tpf3mp-launcher.exe "$dir/TPF3-MP.exe"
              cp target/release/tpf3mp-agent.exe target/release/tpf3mp-server.exe \
                 target/release/tpf3mp-fakegame.exe target/release/tpf3mp_hook.dll "$dir/"
              # The installer: readable scripts, not a program, so players
              # can see what it changes (docs/DECISIONS.md, D9).
              cp packaging/windows/INSTALL_TPF3MP.cmd packaging/windows/UNINSTALL_TPF3MP.cmd "$dir/"
              mkdir -p "$dir/tools"
              cp packaging/windows/tools/install.ps1 "$dir/tools/"
              7z a "$dir.zip" "$dir" > /dev/null
              echo "archive=$dir.zip" >> "$GITHUB_ENV"
              ;;
            linux-*)
              cp target/release/tpf3mp-launcher target/release/tpf3mp-agent \
                 target/release/tpf3mp-server target/release/tpf3mp-fakegame \
                 target/release/libtpf3mp_hook.so \
                 packaging/unix/install.sh packaging/unix/uninstall.sh "$dir/"
              chmod +x "$dir/install.sh" "$dir/uninstall.sh"
              tar czf "$dir.tar.gz" "$dir"
              echo "archive=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
            macos-*)
              app="$dir/TPF3-MP.app/Contents"
              mkdir -p "$app/MacOS"
              cp target/release/tpf3mp-launcher "$app/MacOS/TPF3-MP"
              sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Info.plist"
              # An ad-hoc signature seals the bundle: without one, macOS calls
              # a downloaded app "damaged" instead of offering to open it.
              codesign --force --deep --sign - "$dir/TPF3-MP.app"
              codesign --verify --deep --strict --verbose=2 "$dir/TPF3-MP.app"
              cp target/release/tpf3mp-agent target/release/tpf3mp-server \
                 target/release/tpf3mp-fakegame target/release/libtpf3mp_hook.dylib \
                 packaging/unix/install.sh packaging/unix/uninstall.sh "$dir/"
              chmod +x "$dir/install.sh" "$dir/uninstall.sh"
              tar czf "$dir.tar.gz" "$dir"
              echo "archive=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.archive }}
          if-no-files-found: error
