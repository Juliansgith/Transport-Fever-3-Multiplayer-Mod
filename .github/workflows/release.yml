name: release

# Builds the player's package for every platform: the launcher window, the
# agent, the in-game hook library and the server. Runs by hand, which
# leaves the packages as workflow artifacts, or on a push to `main`, the
# release branch (see AGENTS.md), which also attaches them to a draft
# release of the workspace's version, to review before publishing.
#
# Repository variables it builds in (Settings, Secrets and variables,
# Actions, Variables):
# - TPF3MP_DEFAULT_SERVER: the server the launcher offers first;
# - TPF3MP_UPDATE_PUBLIC_KEY: the public keys updates must be signed with.
#   Without one the launcher never updates itself, so no release is
#   drafted: manual runs still build packages to try.
#
# It signs nothing: publishing a release starts sign.yml, which signs it
# for the updater in the protected `release` environment. Actions are
# pinned to commits, since what this builds gets signed.
#
# THE PROXY DLL (release day): variable TPF3MP_PROXY_DLL, or the input
# proxy_dll of a run by hand, names the DLL the game loads from its own
# folder that the Windows proxy stands in for, such as `alut.dll`. It is
# the one setting this workflow needs from the release-day investigation
# (docs/DAY_ONE.md). Unset, the Windows package carries no proxy, and
# INSTALL_TPF3MP.cmd then installs no hook on Windows: it fails closed. The proxy's exports come from packaging/windows/proxy/<stem>.def
# (written by tpf3mp-proxygen from the game's DLL) or, for a Windows
# system DLL, from the runner's copy.
on:
  workflow_dispatch:
    inputs:
      proxy_dll:
        description: "The game DLL the Windows proxy stands in for, such as alut.dll; overrides the variable TPF3MP_PROXY_DLL"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::cannot read the workspace version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          # The oldest supported Ubuntu, so the binaries also run on
          # distributions with an older C library.
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      # Built into the launcher: the server it offers first, the key its
      # updates must be signed with, and where it looks for them.
      TPF3MP_DEFAULT_SERVER: ${{ vars.TPF3MP_DEFAULT_SERVER }}
      TPF3MP_UPDATE_PUBLIC_KEY: ${{ vars.TPF3MP_UPDATE_PUBLIC_KEY }}
      TPF3MP_REPOSITORY: ${{ github.repository }}
      # The DLL the Windows proxy stands in for; see the top of this file.
      TPF3MP_PROXY_DLL: ${{ inputs.proxy_dll || vars.TPF3MP_PROXY_DLL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check the settings built in
        shell: bash
        run: |
          set -euo pipefail
          # A bracket expression: "]" first and "-" last are literal.
          if [ -n "$TPF3MP_DEFAULT_SERVER" ] && ! [[ "$TPF3MP_DEFAULT_SERVER" =~ ^[]A-Za-z0-9.:[-]+$ ]]; then
            echo "::error::TPF3MP_DEFAULT_SERVER must be host:port, nothing else"
            exit 1
          fi
          # One key or several, separated by commas or spaces.
          if [ -n "$TPF3MP_UPDATE_PUBLIC_KEY" ] && ! [[ "$TPF3MP_UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=([\ ,]+[A-Za-z0-9+/]{43}=)*$ ]]; then
            echo "::error::TPF3MP_UPDATE_PUBLIC_KEY must be base64 32-byte Ed25519 public keys, separated by commas"
            exit 1
          fi
          if [ -z "$TPF3MP_UPDATE_PUBLIC_KEY" ]; then
            echo "::warning::no TPF3MP_UPDATE_PUBLIC_KEY: these launchers will never update themselves"
          fi
      - name: Build
        run: |
          cargo build --release --locked -p tpf3mp-launcher -p tpf3mp-agent -p tpf3mp-server -p tpf3mp-hook
          # Stands in for the game in playtests until it is out.
          cargo build --release --locked -p tpf3mp-testkit --bin tpf3mp-fakegame
      - name: Build the proxy DLL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="$TPF3MP_PROXY_DLL"
          if [ -z "$name" ]; then
            echo "::warning::TPF3MP_PROXY_DLL is not set: the Windows package carries no proxy DLL, so its hook cannot be installed"
            exit 0
          fi
          if ! [[ "$name" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*\.[dD][lL][lL]$ ]]; then
            echo "::error::TPF3MP_PROXY_DLL must be a DLL's file name, such as alut.dll"
            exit 1
          fi
          stem="${name%.*}"
          def="packaging/windows/proxy/$stem.def"
          if [ -f "$def" ]; then
            source="$def"
          elif [ -f "/c/Windows/System32/$name" ]; then
            source="/c/Windows/System32/$name"
          else
            echo "::error::no exports for $name: commit $def, written by tpf3mp-proxygen from the game's $name"
            exit 1
          fi
          crate="$RUNNER_TEMP/proxy-crate"
          # Outside the workspace, which the generated crate is not part of.
          cargo run --release --locked -p tpf3mp-proxygen -- "$source" "$crate" "$stem" --load-hook tpf3mp_hook.dll
          CARGO_TARGET_DIR="$RUNNER_TEMP/proxy-target" cargo build --release --offline --manifest-path "$crate/Cargo.toml"
          built=("$RUNNER_TEMP"/proxy-target/release/*.dll)
          if [ "${#built[@]}" -ne 1 ] || [ ! -f "${built[0]}" ]; then
            echo "::error::the proxy build left no single DLL"
            exit 1
          fi
          mkdir -p proxy-out
          cp "${built[0]}" "proxy-out/$name"
          echo "built the proxy for $name from $source"
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          dir="tpf3mp-${VERSION}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp README.md LICENSE docs/PLAYING.md "$dir/"
          # The Lua mod, once the repository has it; the install script
          # copies it into the player's mods folder.
          if [ -d mod/tpf3mp_1 ]; then
            mkdir -p "$dir/mod"
            cp -R mod/tpf3mp_1 "$dir/mod/"
          else
            echo "::notice::no mod/tpf3mp_1 in the repository yet: the package carries no Lua mod"
          fi
          # Tells the launcher's updater this folder is an installed package.
          printf '{"version":"%s","platform":"%s"}\n' "$VERSION" "${{ matrix.name }}" \
            > "$dir/tpf3mp-package.json"
          case "${{ matrix.name }}" in
            windows-*)
              cp target/release/tpf3mp-launcher.exe "$dir/TPF3-MP.exe"
              cp target/release/tpf3mp-agent.exe target/release/tpf3mp-server.exe \
                 target/release/tpf3mp-fakegame.exe target/release/tpf3mp_hook.dll "$dir/"
              # The installer: readable scripts, not a program, so players
              # can see what it changes (docs/DECISIONS.md, D9).
              cp packaging/windows/INSTALL_TPF3MP.cmd packaging/windows/UNINSTALL_TPF3MP.cmd "$dir/"
              mkdir -p "$dir/tools"
              cp packaging/windows/tools/install.ps1 "$dir/tools/"
              # proxy/<the DLL it stands in for>, when it was built.
              if [ -d proxy-out ]; then
                mkdir -p "$dir/proxy"
                cp proxy-out/*.dll "$dir/proxy/"
              fi
              7z a "$dir.zip" "$dir" > /dev/null
              echo "archive=$dir.zip" >> "$GITHUB_ENV"
              ;;
            linux-*)
              cp target/release/tpf3mp-launcher target/release/tpf3mp-agent \
                 target/release/tpf3mp-server target/release/tpf3mp-fakegame \
                 target/release/libtpf3mp_hook.so \
                 packaging/unix/install.sh packaging/unix/uninstall.sh "$dir/"
              chmod +x "$dir/install.sh" "$dir/uninstall.sh"
              tar czf "$dir.tar.gz" "$dir"
              echo "archive=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
            macos-*)
              app="$dir/TPF3-MP.app/Contents"
              mkdir -p "$app/MacOS"
              cp target/release/tpf3mp-launcher "$app/MacOS/TPF3-MP"
              sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Info.plist"
              # An ad-hoc signature seals the bundle: without one, macOS calls
              # a downloaded app "damaged" instead of offering to open it.
              codesign --force --deep --sign - "$dir/TPF3-MP.app"
              codesign --verify --deep --strict --verbose=2 "$dir/TPF3-MP.app"
              cp target/release/tpf3mp-agent target/release/tpf3mp-server \
                 target/release/tpf3mp-fakegame target/release/libtpf3mp_hook.dylib \
                 packaging/unix/install.sh packaging/unix/uninstall.sh "$dir/"
              chmod +x "$dir/install.sh" "$dir/uninstall.sh"
              tar czf "$dir.tar.gz" "$dir"
              echo "archive=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.archive }}
          if-no-files-found: error

  draft:
    name: draft release
    needs: [version, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fail closed: a published launcher built without the update key can
      # never update itself, so its players would download every later
      # version by hand. Only a draft can be published; make none.
      - name: Check the release can update itself
        env:
          TPF3MP_UPDATE_PUBLIC_KEY: ${{ vars.TPF3MP_UPDATE_PUBLIC_KEY }}
          TPF3MP_DEFAULT_SERVER: ${{ vars.TPF3MP_DEFAULT_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "$TPF3MP_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::no draft without the repository variable TPF3MP_UPDATE_PUBLIC_KEY: set up the update key (docs/OPERATIONS.md, \"Before the first release\"), then re-run this workflow"
            exit 1
          fi
          if [ -z "$TPF3MP_DEFAULT_SERVER" ]; then
            echo "::warning::no TPF3MP_DEFAULT_SERVER: players must type the server's address"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A published version is final: releasing again needs a version
          # bump in Cargo.toml. A draft is refreshed with this commit.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published; bump the version in Cargo.toml"
              exit 1
            fi
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" packages/* \
              --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
              --target "$GITHUB_SHA" --title "TPF3-MP $TAG"
          fi
