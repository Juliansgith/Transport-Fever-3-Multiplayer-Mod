name: release

# Builds the player's package for every platform (package.yml). Runs by
# hand, which leaves the packages as workflow artifacts, or on a push to
# `main`, the release branch (see AGENTS.md), which also attaches them to a
# draft release of the workspace's version, to review before publishing.
# Without the repository variables TPF3MP_DEFAULT_SERVER and
# TPF3MP_UPDATE_PUBLIC_KEY no release is drafted: manual runs still build
# packages to try.
#
# It signs nothing: publishing a release starts sign.yml, which signs it
# for the updater in the protected `release` environment.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::cannot read the workspace version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: package
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  draft:
    name: draft release
    needs: [version, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fail closed: a published launcher built without the update key can
      # never update itself, so its players would download every later
      # version by hand. Only a draft can be published; make none.
      - name: Check the release can update itself
        env:
          TPF3MP_UPDATE_PUBLIC_KEY: ${{ vars.TPF3MP_UPDATE_PUBLIC_KEY }}
          TPF3MP_DEFAULT_SERVER: ${{ vars.TPF3MP_DEFAULT_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "$TPF3MP_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::no draft without the repository variable TPF3MP_UPDATE_PUBLIC_KEY: set up the update key (docs/OPERATIONS.md, \"Before the first release\"), then re-run this workflow"
            exit 1
          fi
          if [ -z "$TPF3MP_DEFAULT_SERVER" ]; then
            echo "::error::no draft without the repository variable TPF3MP_DEFAULT_SERVER: the launcher plays on that server alone (docs/DECISIONS.md, D12). Set it (docs/OPERATIONS.md, \"Before the first release\"), then re-run this workflow"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # A published version is final: releasing again needs a version
          # bump in Cargo.toml. A draft is refreshed with this commit.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published; bump the version in Cargo.toml"
              exit 1
            fi
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" packages/* \
              --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
              --target "$GITHUB_SHA" --title "TPF3-MP $TAG"
          fi
