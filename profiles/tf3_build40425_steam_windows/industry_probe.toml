# Optional read-only industry-demand diagnostics for the exact 40425 build.
# Observations stay optional. The scheduler site is also a required normal
# hook in hooks.toml; enabling this probe adds diagnostics to that hook.
name = "Transport Fever 3 Build 40425 (Steam, Windows x64)"
image_base = 0x140000000
region = ".text"

[build]
sha256 = "e9a6190f9ca8f7f34a46dfafac0f3b897e41ea6dc6498d6f5871aed6b9ca74cd"
size = 69876664
pe_timestamp = 0x6AD9CE10

# Seed splice at sub_150310+0x13d, after the four GameTime bytes were
# folded into FNV-1a in rdi. It preserves the following instructions.
[[target]]
name = "industry spawn seed"
signature = "4C 8B 46 08 48 8B 16 48 8D 8C 24 A0 00 00 00"
offset = 0
prologue = "4C 8B 46 08 48 8B 16"
required = true

[[target]]
name = "industry candidate loop"
signature = "C6 44 24 70 00 44 8B CF 4D 8B C5 48 8D 55 50"
offset = 0
prologue = "C6 44 24 70 00 44 8B CF"
required = true

# The call at sub_158cb0+0x153 invokes sub_14fc50, which checks the cargo's
# industry-closed log entry; this records its one-byte result unchanged.
[[target]]
name = "industry candidate gate result"
signature = "48 89 8D B0 00 00 00 48 89 9D B8 00 00 00 48 8D 8D B0 00 00 00"
offset = 0
prologue = "48 89 8D B0 00 00 00"
required = true

# After sub_8ed760 returns, the stack result is an entity ID or -1.
[[target]]
name = "industry emitted entity"
signature = "8B 5D 84 83 FB FF 0F 84 36 04 00 00"
offset = 0
prologue = "8B 5D 84 83 FB FF"
required = true

# Immediately after its lambda returns, emit one bounded record.
[[target]]
name = "industry spawn callback end"
signature = "E8 ?? ?? ?? ?? 90 48 8B 9C 24 B0 00 00 00 48 85 DB 74 ??"
offset = 5
prologue = "90 48 8B 9C 24 B0 00 00 00"
required = true

# The two MSVC std::string lookup keys start at RDX and RDX+0x20;
# unchanged EAX is the free target capacity (-1 when absent).
[[target]]
name = "GetFreeTargetCapacity"
signature = "48 89 74 24 20 41 56 48 83 EC 20 48 83 7A 30 00"
offset = 0
prologue = "48 89 74 24 20 41 56 48 83 EC 20 48 83 7A 30 00"
required = true

# OnIntervalStep's demand scheduler; scalar interval time is its second arg.
[[target]]
name = "industry schedule"
signature = "48 89 5C 24 10 55 56 57 41 54 41 55 41 56 41 57 48 8D AC 24 10 FE FF FF 48 81 EC F0 02 00 00 4C 8B F9 4C 8B 41 08 49 8B 40 18 80 B8 F8 01 00 00 00"
offset = 0
prologue = "48 89 5C 24 10 55 56 57 41 54 41 55 41 56 41 57"
required = true

[[target]]
name = "industry town demand"
signature = "48 89 5C 24 10 48 89 74 24 18 48 89 7C 24 20 55 41 56 41 57 48 8D 6C 24 B9 48 81 EC F0 00 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 45 3F 48 63 DA 48 8B F1 48 8B 01 48 8B B8 B0 00 00 00"
offset = 0
prologue = "48 89 5C 24 10 48 89 74 24 18 48 89 7C 24 20 55"
required = true

[[target]]
name = "industry demand equality"
signature = "48 89 5C 24 10 48 89 6C 24 18 48 89 74 24 20 57 41 54 41 55 41 56 41 57 48 8B 42 10 4C 8B D2"
offset = 0
