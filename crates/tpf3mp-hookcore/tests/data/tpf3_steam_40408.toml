# Signature profile for Transport Fever 3, Steam build 40408 (Windows x64).
#
# The first TF3 profile, from the release-day static recon
# (investigation/TPF3_RECON_2026-09-29.md). Targets were located by RTTI,
# source-file asserts and luabridge (TF3's release build has almost no
# __FUNCSIG__ names), and each signature was generated with
# `tpfre q sig <rva> --toml` and confirmed to match exactly once across
# `.text`. RVAs are from image base 0x140000000; `.text` is readable on disk
# for this build (the SteamStub `.bind` section does not encrypt it).
#
# NOT YET MEASURED in-game. The targets resolve statically (proven by
# tests/tpf3_steam_static_proof.rs against the real exe), but which of them
# the hook detours, and the CommandList-vs-DeferredCommandBuffer question,
# wait on the in-game reconciliation TPF3_RECON_2026-09-29.md lists. The
# Epic/GOG build (40393) needs its own profile.

name = "Transport Fever 3 Build 40408 (Steam, Windows x64)"
image_base = 0x140000000
region = ".text"

[build]
sha256 = "de1daad3a13f3b7e9f79903361bb43769cf4f15e59271a263aefe1f075f23ef2"
size = 69711288
pe_timestamp = 0x6AB69FE5

